<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Analytics</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <!-- Script oficial de carregamento dos componentes web do Qlik Cloud -->
  <script crossorigin="anonymous" src="https://copastur.br.qlikcloud.com/resources/embed.js" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
    }
    #bar {
      height: 32px;
      background: #0b2e59;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }
    #bar button {
      background: #0078d4;
      border: none;
      color: #fff;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    #bar button:hover { background: #005a9e; }
    
    /* A área onde o componente Qlik será embutido */
    #qlik-container {
      width: 100%;
      height: calc(100% - 32px);
    }
    qlik-embed {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>Travel Analytics (Copastur - Qlik Cloud)</span>
    <button onclick="abrirModal()">Expandir Janela</button>
  </div>

  <div id="qlik-container">
    <!-- Componente oficial gerado pelo Qlik Cloud -->
    <qlik-embed 
      ui="analytics/sheet" 
      app-id="a37a35c7-e157-4fba-8250-eb9eeeacab46" 
      sheet-id="f284c457-4030-4daf-ab49-66c4f7afdcc0" 
      theme="Theme Copastur" 
      iframe="true" 
      preview="true">
    </qlik-embed>
  </div>

  <script>
    const TARGET_URL = "https://copastur.br.qlikcloud.com/sense/app/a37a35c7-e157-4fba-8250-eb9eeeacab46/sheet/f284c457-4030-4daf-ab49-66c4f7afdcc0/state/analysis";

    Office.initialize = function () {};
    Office.onReady(function () {});

    function abrirModal() {
      if (typeof Office !== "undefined" && Office.context && Office.context.ui) {
        Office.context.ui.displayDialogAsync(
          TARGET_URL,
          { height: 90, width: 90, promptBeforeOpen: false },
          function (res) {
            if (res.status === Office.AsyncResultStatus.Failed) {
              window.open(TARGET_URL, "_blank");
            }
          }
        );
      } else {
        window.open(TARGET_URL, "_blank");
      }
    }
  </script>
</body>
</html>
