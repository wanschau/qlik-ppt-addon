<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;font-family:"Segoe UI";background:linear-gradient(135deg,#0b2e59,#16437a);color:#fff}
    #c{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}
    button{background:#107c41;color:#fff;border:0;padding:12px 26px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div id="c">
    <h2>Travel Analytics – Copastur</h2>
    <button onclick="abrir()">Abrir Painel Interativo</button>
  </div>
  <script>
    const URL_QLIK = "https://copastur.br.qlikcloud.com/sense/app/a37a35c7-e157-4fba-8250-eb9eeeacab46/sheet/f284c457-4030-4daf-ab49-66e4f7afdcc0/state/analysis";
    Office.onReady(() => {});
    function abrir() {
      Office.context.ui.displayDialogAsync(URL_QLIK,
        { height: 90, width: 90, displayInIframe: false, promptBeforeOpen: false },
        r => { if (r.status === Office.AsyncResultStatus.Failed) window.open(URL_QLIK, "_blank"); });
    }
  </script>
</body>
</html>
