<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Analytics</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
    }
    #bar {
      height: 36px;
      background: #0b2e59;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }
    #bar button {
      background: #0078d4;
      border: none;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-left: 6px;
      font-weight: 600;
    }
    #bar button:hover { background: #005a9e; }
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100% - 36px);
      text-align: center;
      padding: 20px;
      color: #1e293b;
    }
    #placeholder h2 { margin-bottom: 8px; color: #0b2e59; }
    #placeholder p { margin-bottom: 16px; font-size: 13px; color: #475569; max-width: 480px; }
    .btn-main {
      background: #0b2e59;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-main:hover { background: #16437a; }
    #qlik-frame {
      display: none;
      width: 100%;
      height: calc(100% - 36px);
      border: none;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>Painel Travel Analytics (Copastur - Qlik Cloud)</span>
    <div>
      <button onclick="carregarIframe()">Tentar no Slide (Iframe)</button>
      <button onclick="abrirModal()">Abrir Painel Interativo</button>
    </div>
  </div>

  <div id="placeholder">
    <h2>Travel Analytics - Copastur</h2>
    <p>O servidor de autenticação da Copastur bloqueia visualização direta em iframe. Utilize os botões abaixo para abrir o dashboard ao vivo.</p>
    <button class="btn-main" onclick="abrirModal()">Abrir Dashboard em Janela Completa</button>
  </div>

  <iframe id="qlik-frame" allow="fullscreen"></iframe>

  <script>
    const TARGET_URL = "https://copastur.br.qlikcloud.com/sense/app/a37a35c7-e157-4fba-8250-eb9eeeacab46/sheet/f284c457-4030-4daf-ab49-66c4f7afdcc0/state/analysis";

    // Obrigatório para ContentApp no esquema 1.1 do PowerPoint Desktop
    Office.initialize = function () {
      console.log("Office.initialize concluído.");
    };

    Office.onReady(function () {
      console.log("Office.onReady concluído.");
    });

    function carregarIframe() {
      document.getElementById("placeholder").style.display = "none";
      const frame = document.getElementById("qlik-frame");
      frame.style.display = "block";
      frame.src = TARGET_URL;
    }

    function abrirModal() {
      if (typeof Office !== "undefined" && Office.context && Office.context.ui) {
        Office.context.ui.displayDialogAsync(
          TARGET_URL,
          { height: 90, width: 90, promptBeforeOpen: false },
          function (res) {
            if (res.status === Office.AsyncResultStatus.Failed) {
              window.open(TARGET_URL, "_blank");
            }
          }
        );
      } else {
        window.open(TARGET_URL, "_blank");
      }
    }
  </script>
</body>
</html>
