<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Analytics</title>
  <!-- Script essencial para o PowerPoint validar o suplemento -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: Segoe UI, sans-serif; }
    #bar {
      height: 32px;
      background: #0b2e59;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: #fff;
      font-size: 11px;
    }
    #bar button {
      background: #0078d4;
      border: none;
      color: #fff;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      margin-left: 6px;
    }
    #bar button:hover { background: #005a9e; }
    #qlik-frame {
      width: 100%;
      height: calc(100% - 32px);
      border: none;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>Painel Travel Analytics (Copastur)</span>
    <div>
      <button onclick="recarregar()">Recarregar</button>
      <button onclick="abrirModal()">Modo Janela Completa</button>
    </div>
  </div>

  <iframe
    id="qlik-frame"
    src="https://copastur.br.qlikcloud.com/sense/app/a37a35c7-e157-4fba-8250-eb9eeeacab46/sheet/f284c457-4030-4daf-ab49-66c4f7afdcc0/state/analysis"
    allow="fullscreen">
  </iframe>

  <script>
    const TARGET_URL = "https://copastur.br.qlikcloud.com/sense/app/a37a35c7-e157-4fba-8250-eb9eeeacab46/sheet/f284c457-4030-4daf-ab49-66c4f7afdcc0/state/analysis";

    Office.onReady(() => {
      console.log("Office.js carregado com sucesso.");
    });

    function recarregar() {
      document.getElementById("qlik-frame").src = TARGET_URL;
    }

    function abrirModal() {
      Office.context.ui.displayDialogAsync(
        TARGET_URL,
        { height: 90, width: 90, promptBeforeOpen: false },
        (res) => {
          if (res.status === Office.AsyncResultStatus.Failed) {
            window.open(TARGET_URL, "_blank");
          }
        }
      );
    }
  </script>
</body>
</html>
